<div class="page-head">
  <h1 class="page-title"><i class="bi bi-person-circle"></i> الملف الشخصي</h1>
</div>

<div class="row g-3 g-lg-4">

  <!-- Card -->
  <div class="col-lg-5">
    <div class="surface p-4 text-center">

      <div class="profile-photo-wrapper">
        @if (getProfileImage(); as src) {
          <img [src]="src" class="profile-photo" alt="الصورة الشخصية" (error)="photoBroken = true">
        } @else {
          <div class="profile-photo profile-photo--fallback">{{ initial() }}</div>
        }

        @if (photoLoading) {
          <div class="profile-photo-loading"><span class="spinner-border spinner-border-sm"></span></div>
        }

        <label for="profilePhoto" class="edit-photo-btn" title="تغيير الصورة">
          <i class="fa-solid fa-pen"></i>
        </label>
        <input id="profilePhoto" type="file" accept="image/*" hidden (change)="onPhotoSelected($event)">
      </div>

      <h5 class="mt-3 mb-1">{{ auth.currentUser()?.displayName }}</h5>
      <p class="text-muted mb-2 text-break">{{ auth.currentUser()?.email }}</p>

      <div class="d-flex justify-content-center gap-2 flex-wrap mb-3">
        <span class="chip"><i class="bi bi-gender-ambiguous me-1"></i>{{ genderLabel() }}</span>
        @if (auth.currentUser()?.age) {
          <span class="chip"><i class="bi bi-calendar3 me-1"></i>{{ auth.currentUser()?.age }} سنة</span>
        }
      </div>

      <button type="button" class="btn btn-outline-danger" (click)="deleteAccount()">
        <i class="bi bi-trash me-1"></i> حذف الحساب
      </button>
    </div>
  </div>

  <!-- Change password -->
  <div class="col-lg-7">
    <div class="surface p-3 p-md-4">
      <h5 class="mb-3"><i class="bi bi-shield-lock me-2 text-primary"></i>تغيير كلمة المرور</h5>

      <form [formGroup]="passwordForm" (ngSubmit)="changePassword()" novalidate>
        <div class="mb-3">
          <label class="form-label" for="currentPassword">كلمة المرور الحالية</label>
          <div class="password-field">
            <input id="currentPassword" class="form-control" formControlName="currentPassword"
                   [type]="showCurrent ? 'text' : 'password'" autocomplete="current-password"
                   [class.is-invalid]="passwordForm.controls.currentPassword.invalid && passwordForm.controls.currentPassword.touched">
            <button type="button" class="password-toggle" (click)="showCurrent = !showCurrent" [attr.aria-label]="showCurrent ? 'إخفاء' : 'إظهار'">
              <i class="bi" [class.bi-eye]="!showCurrent" [class.bi-eye-slash]="showCurrent"></i>
            </button>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label" for="newPassword">كلمة المرور الجديدة</label>
          <div class="password-field">
            <input id="newPassword" class="form-control" formControlName="newPassword"
                   [type]="showNew ? 'text' : 'password'" autocomplete="new-password"
                   [class.is-invalid]="passwordForm.controls.newPassword.invalid && passwordForm.controls.newPassword.touched">
            <button type="button" class="password-toggle" (click)="showNew = !showNew" [attr.aria-label]="showNew ? 'إخفاء' : 'إظهار'">
              <i class="bi" [class.bi-eye]="!showNew" [class.bi-eye-slash]="showNew"></i>
            </button>
          </div>
        </div>

        <button class="btn btn-primary" [disabled]="loadingPassword">
          @if (loadingPassword) { <span class="spinner-border spinner-border-sm me-2"></span> }
          {{ loadingPassword ? 'جاري التحديث...' : 'تحديث كلمة المرور' }}
        </button>
      </form>
    </div>
  </div>
</div>
