@if (totalPages > 1) {
  <nav aria-label="التنقل بين الصفحات">
    <ul class="pagination justify-content-center align-items-center mt-4 mb-0">
      
      <!-- زر السابق -->
      <li class="page-item" [class.disabled]="pageIndex === 1">
        <button type="button" class="page-link d-inline-flex align-items-center gap-1" (click)="go(pageIndex - 1)" aria-label="السابق">
          <i class="bi bi-chevron-right lh-1"></i>
          <span class="d-none d-sm-inline">السابق</span>
        </button>
      </li>

      <!-- أرقام الصفحات -->
      @for (p of pages; track $index) {
        @if (p === null) {
          <li class="page-item disabled"><span class="page-link">…</span></li>
        } @else {
          <li class="page-item" [class.active]="p === pageIndex">
            <button type="button" class="page-link" (click)="go(p)">{{ p }}</button>
          </li>
        }
      }

      <!-- زر التالي -->
      <li class="page-item" [class.disabled]="pageIndex === totalPages">
        <button type="button" class="page-link d-inline-flex align-items-center gap-1" (click)="go(pageIndex + 1)" aria-label="التالي">
          <span class="d-none d-sm-inline">التالي</span>
          <i class="bi bi-chevron-left lh-1"></i>
        </button>
      </li>

    </ul>
  </nav>
}
