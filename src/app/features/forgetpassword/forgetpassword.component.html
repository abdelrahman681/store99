<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-icon"><i class="fa-solid fa-key"></i></div>
    <h1 class="auth-title">نسيت كلمة المرور؟</h1>
    <p class="auth-sub">اكتب بريدك الإلكتروني وهنبعتلك كود التحقق.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">البريد الإلكتروني</label>
        <input id="email" type="email" dir="ltr" class="form-control" formControlName="email" autocomplete="email"
               placeholder="example@email.com"
               [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched">
        <div class="invalid-feedback">من فضلك أدخل بريد إلكتروني صحيح</div>
      </div>

      <button class="btn btn-primary btn-lg w-100" [disabled]="loading">
        @if (loading) { <span class="spinner-border spinner-border-sm me-2"></span> جاري الإرسال... } @else { إرسال الكود }
      </button>
    </form>

    <p class="text-center mt-4 mb-0"><a routerLink="/auth/login">الرجوع لتسجيل الدخول</a></p>
  </div>
</div>
