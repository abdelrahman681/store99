<div class="row justify-content-center">
  <div class="col-lg-8 col-xl-7">
    <div class="surface p-3 p-md-4 p-lg-5">

      <div class="text-center mb-4">
        <div class="auth-icon"><i class="fa-solid fa-headset"></i></div>
        <h1 class="auth-title">تواصل معنا</h1>
        <p class="auth-sub mb-0">عندك استفسار أو مشكلة في طلب؟ ابعتلنا وهنرد عليك في أقرب وقت.</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="senderName">الاسم</label>
            <input id="senderName" class="form-control" formControlName="senderName" autocomplete="name"
                   [class.is-invalid]="form.get('senderName')?.invalid && form.get('senderName')?.touched">
            <div class="invalid-feedback">الاسم مطلوب</div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="senderEmail">البريد الإلكتروني</label>
            <input id="senderEmail" type="email" class="form-control" formControlName="senderEmail" autocomplete="email" dir="ltr"
                   [class.is-invalid]="form.get('senderEmail')?.invalid && form.get('senderEmail')?.touched">
            <div class="invalid-feedback">من فضلك أدخل بريد إلكتروني صحيح</div>
          </div>
          <div class="col-12">
            <label class="form-label" for="messages">رسالتك</label>
            <textarea id="messages" class="form-control" rows="5" formControlName="messages" maxlength="1000"
                      [class.is-invalid]="form.get('messages')?.invalid && form.get('messages')?.touched"></textarea>
            <div class="invalid-feedback">الرسالة مطلوبة (حتى 1000 حرف)</div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 mt-4" [disabled]="submitting">
          @if (submitting) { <span class="spinner-border spinner-border-sm me-2"></span> }
          <i class="fa-solid fa-paper-plane me-1"></i> إرسال
        </button>
      </form>
    </div>
  </div>
</div>
