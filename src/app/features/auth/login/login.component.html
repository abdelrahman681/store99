<style>
  .required-field::after {
  content: " *";
  color: #dc3545; /* لون أحمر الخاص بـ Bootstrap */
  font-weight: bold;
}
</style>
<div class="auth-split">
  <app-auth-side title="أهلاً بيك تاني في" highlight="Store99" text="سجّل دخولك وكمّل تسوّقك من حيث وقفت." />
  <div class="auth-main">
  <div class="auth-card">

    <div class="auth-icon"><i class="fa-solid fa-right-to-bracket"></i></div>
    <h1 class="auth-title">تسجيل الدخول</h1>
    <p class="auth-sub">أهلاً بيك تاني! سجّل دخولك لمتابعة طلباتك.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>

      <!-- Email -->
      <div class="mb-3">
        <label class="form-label required-field" for="email">البريد الإلكتروني</label>
        <input
          id="email"
          type="email"
          dir="ltr"
          class="form-control"
          formControlName="email"
          autocomplete="email"
          placeholder="example@email.com"
          [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched">
        <div class="invalid-feedback">من فضلك أدخل بريد إلكتروني صحيح</div>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label class="form-label required-field" for="password">كلمة المرور</label>
        <div class="password-field">
          <input
            id="password"
            class="form-control"
            formControlName="password"
            autocomplete="current-password"
            placeholder="ادخل كلمة المرور"
            [type]="showPassword ? 'text' : 'password'"
            [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched">
          <button type="button" class="password-toggle" (click)="showPassword = !showPassword"
                  [attr.aria-label]="showPassword ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'">
            <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
          </button>
        </div>
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <div class="text-danger small mt-1">كلمة المرور مطلوبة</div>
        }
      </div>

      <div class="form-check mb-3">
  <input class="form-check-input" type="checkbox" id="rememberMe" formControlName="rememberMe">
  <label class="form-check-label" for="rememberMe">تذكرني</label>
</div>

      <div class="text-end mb-3">
        <a routerLink="/forgot-password" class="small">هل نسيت كلمة المرور؟</a>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="loading$ | async">
        @if (loading$ | async) {
          <span class="spinner-border spinner-border-sm me-2"></span> جاري تسجيل الدخول...
        } @else {
          دخول
        }
      </button>
    </form>

    <div class="auth-divider"><span>أو</span></div>

    <div class="d-flex justify-content-center">
      <div id="google-button"></div>
    </div>

    <p class="text-center text-muted mt-4 mb-0">
      ماعندكش حساب؟ <a routerLink="/auth/register" class="fw-bold">إنشاء حساب</a>
    </p>
  </div>
  </div>
</div>
