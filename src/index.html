<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>Store99</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#312e81">
  <link rel="icon" type="image/x-icon" href="./assets/Free Stock Photos, PNGs, Templates & Mockups _ rawpixel.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Splash styles live here (not in styles.scss) so the logo is styled on the very first paint -->
  <style>
    html, body { margin: 0; }
    .app-splash {
      position: fixed; inset: 0; z-index: 4000;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1rem;
      background: radial-gradient(circle at 30% 20%, #4f46e5 0%, #312e81 55%, #1e1b4b 100%);
      color: #fff; font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
      transition: opacity .55s ease, visibility .55s ease, transform .55s ease;
    }
    .app-splash.is-leaving { opacity: 0; visibility: hidden; transform: scale(1.04); }
    .app-splash__logo { position: relative; width: 104px; height: 104px; display: grid; place-items: center; }
    .app-splash__ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.18); border-top-color: #fff;
      animation: splash-spin 1.1s linear infinite;
    }
    .app-splash__pulse {
      position: absolute; inset: 10px; border-radius: 50%; background: rgba(255,255,255,.12);
      animation: splash-pulse 1.8s ease-in-out infinite;
    }
    .app-splash__bag { position: relative; animation: splash-bounce 1.4s ease-in-out infinite; }
    .app-splash__brand { font-size: 1.7rem; font-weight: 800; letter-spacing: .5px; animation: splash-fade .8s ease both; }
    .app-splash__dots { display: flex; gap: 7px; }
    .app-splash__dots span { width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: .35; animation: splash-dot 1.2s ease-in-out infinite; }
    .app-splash__dots span:nth-child(2) { animation-delay: .18s; }
    .app-splash__dots span:nth-child(3) { animation-delay: .36s; }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    @keyframes splash-pulse { 0%, 100% { transform: scale(.85); opacity: .6; } 50% { transform: scale(1.08); opacity: 1; } }
    @keyframes splash-bounce { 0%, 100% { transform: translateY(2px); } 50% { transform: translateY(-6px); } }
    @keyframes splash-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes splash-dot { 0%, 80%, 100% { opacity: .3; transform: scale(.8); } 40% { opacity: 1; transform: scale(1.25); } }
    @media (prefers-reduced-motion: reduce) {
      .app-splash *, .app-splash { animation-duration: 3s !important; }
    }
  </style>
</head>
<body>
  <app-root>
    <div class="app-splash" role="status" aria-label="جاري التحميل">
      <div class="app-splash__logo">
        <span class="app-splash__ring"></span>
        <span class="app-splash__pulse"></span>
        <svg class="app-splash__bag" viewBox="0 0 64 64" width="46" height="46" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 22h36l-3 30a4 4 0 0 1-4 3.6H21a4 4 0 0 1-4-3.6L14 22z"/>
          <path d="M23 22v-3a9 9 0 0 1 18 0v3"/>
        </svg>
      </div>
      <div class="app-splash__brand">Store99</div>
      <div class="app-splash__dots"><span></span><span></span><span></span></div>
    </div>
  </app-root>
</body>
</html>
