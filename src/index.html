<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>Store99</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#292524">
  <link rel="icon" type="image/x-icon" href="./assets/Free Stock Photos, PNGs, Templates & Mockups _ rawpixel.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Splash: lives in index.html (outside <app-root>) so its animation is never restarted when Angular boots -->
  <style>
    html, body { margin: 0; }
    .app-splash {
      position: fixed; inset: 0; z-index: 4000;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4rem;
      background: #1c1917; color: #f5f1ea; font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
      transition: opacity .5s ease, visibility .5s ease;
    }
    .app-splash.is-leaving { opacity: 0; visibility: hidden; }
    .app-splash.is-leaving .sp-mark { transform: scale(.9); transition: transform .5s ease; }

    /* ---- the mark: a bag drawn line by line, then the 99 ---- */
    .sp-mark { width: 132px; height: 132px; overflow: visible; }
    .sp-bob { transform-origin: 60px 106px; animation: sp-bob 2.6s ease-in-out 2.1s infinite; }
    .sp-line { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 5; stroke-dasharray: 1; stroke-dashoffset: 0; }
    .sp-bag { stroke: #f5f1ea; }
    .sp-nine { stroke: #ea580c; }
    .sp-body   { animation: sp-draw .9s cubic-bezier(.6, 0, .2, 1) .1s backwards; }
    .sp-handle { animation: sp-draw .55s cubic-bezier(.6, 0, .2, 1) .8s backwards; }
    .sp-n1     { animation: sp-draw .5s ease-out 1.25s backwards; }
    .sp-n2     { animation: sp-draw .5s ease-out 1.5s backwards; }
    .sp-shadow { fill: #000; opacity: .28; transform-origin: 60px 116px; animation: sp-shadow 2.6s ease-in-out 2.1s infinite, sp-fade .6s ease 1s backwards; }

    /* ---- wordmark ---- */
    .sp-word { display: flex; direction: ltr; font-size: 1.9rem; font-weight: 800; letter-spacing: .04em; line-height: 1; }
    .sp-word span { display: inline-block; animation: sp-rise .5s cubic-bezier(.2, .8, .3, 1) backwards; }
    .sp-word .nn { color: #ea580c; }

    /* ---- loading line ---- */
    .sp-track { width: 92px; height: 3px; border-radius: 3px; background: rgba(245, 241, 234, .14); overflow: hidden; animation: sp-fade .5s ease 1.9s backwards; }
    .sp-track i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #ea580c; animation: sp-slide 1.2s ease-in-out infinite; }

    @keyframes sp-draw   { from { stroke-dashoffset: 1; } }
    @keyframes sp-rise   { from { opacity: 0; transform: translateY(14px); } }
    @keyframes sp-fade   { from { opacity: 0; } }
    @keyframes sp-bob    { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-5px) rotate(-1.5deg); } }
    @keyframes sp-shadow { 0%, 100% { transform: scaleX(1); opacity: .28; } 50% { transform: scaleX(.8); opacity: .16; } }
    @keyframes sp-slide  { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }

    /* people who asked for less motion get the finished logo, no animation */
    @media (prefers-reduced-motion: reduce) {
      .app-splash *, .app-splash *::before { animation: none !important; }
    }
  </style>
</head>
<body>
  <app-root></app-root>

  <div class="app-splash" id="app-splash" role="status" aria-label="جاري التحميل">
    <svg class="sp-mark" viewBox="0 0 120 120" aria-hidden="true">
      <ellipse class="sp-shadow" cx="60" cy="116" rx="34" ry="4"/>
      <g class="sp-bob">
        <!-- bag body + handle (pathLength=1 so one dash value works for every path) -->
        <path class="sp-line sp-bag sp-body" pathLength="1" d="M27 45 H93 L98 99 Q98.6 107 90.5 107 H29.5 Q21.4 107 22 99 Z"/>
        <path class="sp-line sp-bag sp-handle" pathLength="1" d="M44 45 V37 A16 16 0 0 1 76 37 V45"/>
        <!-- 9 9 -->
        <g>
          <circle class="sp-line sp-nine sp-n1" pathLength="1" cx="48" cy="70" r="7.5"/>
          <path class="sp-line sp-nine sp-n1" pathLength="1" d="M55.5 70 C55.5 83 51 89 42.5 89"/>
        </g>
        <g>
          <circle class="sp-line sp-nine sp-n2" pathLength="1" cx="73" cy="70" r="7.5"/>
          <path class="sp-line sp-nine sp-n2" pathLength="1" d="M80.5 70 C80.5 83 76 89 67.5 89"/>
        </g>
      </g>
    </svg>

    <div class="sp-word" aria-label="Store99">
      <span style="animation-delay:1.7s">S</span><span style="animation-delay:1.76s">t</span><span style="animation-delay:1.82s">o</span><span style="animation-delay:1.88s">r</span><span style="animation-delay:1.94s">e</span><span class="nn" style="animation-delay:2s">9</span><span class="nn" style="animation-delay:2.06s">9</span>
    </div>

    <div class="sp-track"><i></i></div>
  </div>
</body>
</html>
